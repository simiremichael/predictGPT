[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "F401", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "football_data", "api", "models", "schemas", "prediction", "ai", "jobs", "utils", "services", "repositories"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/app"]
asyncio_mode = "auto"
